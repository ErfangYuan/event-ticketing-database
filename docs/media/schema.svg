<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">MyTix: twenty tables, one ticket lifecycle</title><desc id="desc">Schema overview generated from actual CREATE TABLE and FOREIGN KEY definitions. Each card lists its primary key and referenced tables. It is an authored diagram, not an application screenshot.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122536"/><stop offset="1" stop-color="#09131d"/></linearGradient></defs><rect width="1600" height="1160" rx="20" fill="url(#bg)"/><g font-family="Consolas,monospace"><text x="46" y="50" font-size="14" fill="#70bfce" letter-spacing="3">SYSTEM DESIGN / MYTIX</text><text x="46" y="101" font-family="Segoe UI,sans-serif" font-weight="600" font-size="38" fill="#f0f6f7">Twenty tables. One ticket lifecycle.</text><text x="46" y="140" font-size="17" fill="#9bb4c2">Identity → discovery → inventory → purchase → ownership history</text><text x="46" y="191" font-size="15" fill="#82d5df" letter-spacing="1">PEOPLE &amp; OWNERSHIP</text><rect x="46" y="212" width="359" height="151" rx="10" fill="#142c3a" stroke="#345467"/><rect x="46" y="230" width="3" height="26" fill="#73d0df"/><text x="63" y="245" font-size="18" font-weight="700" fill="#e1f0f4">payment_cards</text><text x="63" y="277" font-size="13" fill="#96cbd0">PK  cardNumber</text><text x="63" y="297" font-size="13" fill="#a0b3c0">No outgoing foreign keys</text><rect x="46" y="378" width="359" height="151" rx="10" fill="#142c3a" stroke="#345467"/><rect x="46" y="396" width="3" height="26" fill="#73d0df"/><text x="63" y="411" font-size="18" font-weight="700" fill="#e1f0f4">users</text><text x="63" y="443" font-size="13" fill="#96cbd0">PK  userID</text><text x="63" y="463" font-size="13" fill="#a0b3c0">FK  payment_cards</text><rect x="46" y="544" width="359" height="151" rx="10" fill="#142c3a" stroke="#345467"/><rect x="46" y="562" width="3" height="26" fill=